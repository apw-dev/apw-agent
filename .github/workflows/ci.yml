name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            go test -race -count=1 ./...
          else
            go test -count=1 ./...
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/desktop/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: internal/desktop/web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: vitest
        run: npm test

      - name: vite build
        run: npm run build

      - name: Verify committed dist matches source
        working-directory: .
        run: git diff --exit-code internal/desktop/web/dist

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The e2e test runs against the real desktop.Server (go run ./internal/desktop/e2ehelper),
      # which embeds the dist built above.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Playwright E2E
        run: npm run test:e2e

  # APW.exe: the native Desktop shell lives in its own module (cmd/apw-desktop) so the
  # root module above never pulls in Wails.
  desktop-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cmd/apw-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/apw-desktop/go.mod
          cache-dependency-path: cmd/apw-desktop/go.sum

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet -tags desktop,production ./...

      - name: go test
        run: go test -tags desktop,production -count=1 ./...

      - name: go build
        run: go build -tags desktop,production -ldflags "-H windowsgui" -o APW.exe .
