name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            go test -race -count=1 ./...
          else
            go test -count=1 ./...
          fi
